<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="book-save-success-once-title"><title id="book-save-success-once-title">책 등록 완료</title><style>@keyframes tick{from{stroke-dashoffset:90}to{stroke-dashoffset:0}}.tick{stroke-dasharray:90;animation:tick .9s ease-out 1 both}@media(prefers-reduced-motion:reduce){.tick{animation:none;stroke-dashoffset:0}}</style><rect width="160" height="160" rx="40" fill="#e3eee9"/><circle cx="80" cy="80" r="48" fill="#2f5d50"/><path class="tick" d="m55 80 17 18 34-37" fill="none" stroke="#faf8f3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>